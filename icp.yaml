networks:
  - name: local
    mode: managed
    gateway:
      port: 8000

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: src/frontend/dist
        build:
          - pnpm --dir src/frontend install --prefer-offline
          - pnpm --dir src/frontend build
